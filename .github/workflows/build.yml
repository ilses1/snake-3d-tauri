name: Build Desktop App

# Tauri 2 三平台打包：
#   Windows → NSIS 安装包 (.exe)
#   Linux   → .deb + .AppImage
#   macOS   → Universal .dmg（Intel + Apple Silicon 合体）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    strategy:
      # 单个平台失败不影响其他平台继续构建
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            artifact: Snake3D-Windows-x64
            bundles: nsis
            target: ''
            rust-targets: ''
          - platform: ubuntu-22.04
            label: Linux x64
            artifact: Snake3D-Linux-x64
            bundles: deb,appimage
            target: ''
            rust-targets: ''
          - platform: macos-latest
            label: macOS Universal (Intel + Apple Silicon)
            artifact: Snake3D-macOS
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      # Apple Silicon + Intel 双架构需要两个 rust target（universal 依赖它们）
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      # Tauri v2 在 Linux 上依赖 webkit2gtk-4.1 与相关原生库
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            wget
          # AppImage 运行时需要 FUSE，缺失不阻断构建
          sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: 安装前端依赖
        working-directory: tauri-app
        run: npm ci

      # ui/ 目录不入库，由 web/index.html + vendor/three.module.js 现场生成
      - name: 生成 UI
        working-directory: tauri-app
        run: npm run sync

      - name: 打包
        working-directory: tauri-app
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          args=(build --bundles "$BUNDLES")
          if [ -n "$BUILD_TARGET" ]; then
            args+=(--target "$BUILD_TARGET")
          fi
          echo "执行: npx tauri ${args[*]}"
          set +e
          npx tauri "${args[@]}" 2>&1 | tee tauri-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败原因输出为可见注解，便于在运行页面直接定位（无需授权查看日志）
            msg=$(grep -v '^$' tauri-build.log | tail -n 8 | tr '\n' '|' | tr -s ' ' | cut -c1-900)
            echo "::error title=打包失败 (${{ matrix.label }})::$msg"
            exit "$code"
          fi

      # 产物路径按平台/架构各不相同（universal 构建在 target/universal-apple-darwin/ 下），
      # 因此用 find 实搜 bundle 目录，而不是硬编码通配符。
      - name: 校验产物
        shell: bash
        run: |
          mapfile -t files < <(find tauri-app/src-tauri/target -type f \
            -path '*/release/bundle/*' \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | sort)
          if [ "${#files[@]}" -gt 0 ]; then
            printf '%s\n' "${files[@]}" | xargs -I{} ls -lh {}
          fi
          echo "本平台产物数量: ${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=无产物 (${{ matrix.label }})::未生成任何安装包，请查看打包日志"
            exit 1
          fi

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            tauri-app/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/**/release/bundle/deb/*.deb
            tauri-app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/**/release/bundle/rpm/*.rpm

  release:
    name: 发布 Release
    needs: build
    # 即使某个平台构建失败，也把已成功的产物发布出去
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 汇总各平台产物
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 校验待发布产物
        shell: bash
        run: |
          files=$(find release-assets -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | sort)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs -I{} ls -lh {}
          fi
          count=$(printf '%s' "$files" | grep -c . || true)
          echo "待发布文件数: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error title=无可发布产物::所有平台均未产出安装包"
            exit 1
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
