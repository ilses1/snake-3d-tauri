name: Build Desktop App

# Tauri 2 三平台打包：
#   Windows → NSIS 安装包 (.exe)
#   Linux   → .deb + .AppImage
#   macOS   → Universal .dmg（Intel + Apple Silicon 合体）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    strategy:
      # 单个平台失败不影响其他平台继续构建
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            artifact: Snake3D-Windows-x64
            bundles: nsis
            target: ''
            rust-targets: ''
          - platform: ubuntu-22.04
            label: Linux x64
            artifact: Snake3D-Linux-x64
            bundles: deb,appimage
            target: ''
            rust-targets: ''
          - platform: macos-latest
            label: macOS Universal (Intel + Apple Silicon)
            artifact: Snake3D-macOS
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      # Apple Silicon + Intel 双架构需要两个 rust target（universal 依赖它们）
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      # Tauri v2 在 Linux 上依赖 webkit2gtk-4.1 与相关原生库
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            wget
          # AppImage 运行时需要 FUSE，缺失不阻断构建
          sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: 安装前端依赖
        working-directory: tauri-app
        run: npm ci

      # ui/ 目录不入库，由 web/index.html + vendor/three.module.js 现场生成
      - name: 生成 UI
        working-directory: tauri-app
        run: npm run sync

      - name: 打包
        working-directory: tauri-app
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          args=(build --bundles "$BUNDLES")
          if [ -n "$BUILD_TARGET" ]; then
            args+=(--target "$BUILD_TARGET")
          fi
          echo "执行: npx tauri ${args[*]}"
          set +e
          npx tauri "${args[@]}" 2>&1 | tee tauri-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败原因输出为可见注解，便于在运行页面直接定位（无需授权查看日志）
            msg=$(grep -v '^$' tauri-build.log | tail -n 8 | tr '\n' '|' | tr -s ' ' | cut -c1-900)
            echo "::error title=打包失败 (${{ matrix.label }})::$msg"
            exit "$code"
          fi

      # 产物路径按平台/架构各不相同（universal 构建落在 target/universal-apple-darwin/ 下），
      # 因此先把安装包实体收集到统一目录再上传，避免依赖 glob 的路径推断。
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find tauri-app/src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp -v {} dist-artifacts/ \;
          echo "--- 收集结果 ---"
          ls -lh dist-artifacts/ || true
          count=$(ls -1 dist-artifacts/ 2>/dev/null | wc -l)
          echo "本平台产物数量: $count"
          if [ "$count" -eq 0 ]; then
            echo "--- bundle 目录实际内容（诊断）---"
            find tauri-app/src-tauri/target -maxdepth 5 -name bundle -type d -exec sh -c 'echo "[{}]"; ls -1 "{}"' \;
            find tauri-app/src-tauri/target -maxdepth 6 -type d -name '*.app' | head -10
            detail=$(find tauri-app/src-tauri/target -maxdepth 5 -name bundle -type d -exec sh -c 'echo "[{}]:"; ls -1 "{}"' \; | head -14 | tr '\n' ' ')
            echo "::error title=无产物 (${{ matrix.label }})::bundle 目录内容 ${detail}"
            exit 1
          fi

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: dist-artifacts/*

  release:
    name: 发布 Release
    needs: build
    # 即使某个平台构建失败，也把已成功的产物发布出去
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 汇总各平台产物
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 下载下来的文件可能位于各 artifact 的子目录中，先实搜收集再发布，
      # 避免 release-assets/* 只匹配到目录导致「job 成功但 Release 无资产」。
      - name: 收集待发布文件
        shell: bash
        run: |
          mkdir -p upload
          find release-assets -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp -v {} upload/ \;
          echo "--- 待发布文件 ---"
          ls -lh upload/ || true
          count=$(ls -1 upload/ 2>/dev/null | wc -l)
          echo "待发布文件数: $count"
          if [ "$count" -eq 0 ]; then
            echo "--- release-assets 实际内容（诊断）---"
            find release-assets -maxdepth 3 | head -30
            echo "::error title=无可发布产物::所有平台均未产出安装包"
            exit 1
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
